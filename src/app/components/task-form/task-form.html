
<!-- Formulario para agregar tareas -->
<form (ngSubmit)="createTask()" class="task-form">

  <label for="taskTitle">
    Nueva tarea
  </label>

  <div class="form-row">

    <!-- Campo para escribir el nombre de la tarea -->
    <input
      id="taskTitle"
      type="text"
      name="title"
      [(ngModel)]="title"
      placeholder="Escribe el nombre de la tarea..."
      required
      maxlength="120"
    />

    <!-- Botón para agregar la tarea -->
    <button
      type="submit"
      [disabled]="!title.trim()">
      + Agregar
    </button>

  </div>

</form>
