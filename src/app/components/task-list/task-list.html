<div class="task-container">

  <header class="task-header">
    <h1>Gestor de Tareas del Curso</h1>
    <p>Organiza y administra tus actividades.</p>
  </header>

  <!-- Formulario para agregar tareas -->
  <app-task-form
    (taskCreated)="crearTarea($event)">
  </app-task-form>

  <!-- Buscador de tareas -->
  <div class="search-section">
    <label for="search">Buscar tareas</label>

    <input
      id="search"
      type="text"
      placeholder="Buscar por título"
      [ngModel]="textoBusqueda()"
      (ngModelChange)="textoBusqueda.set($event)"
    />
  </div>

  <!-- Botones para filtrar las tareas -->
  <div class="filters">

    <button
      (click)="cambiarFiltro('todas')"
      [class.active]="filtro() === 'todas'">
      Todas
    </button>

    <button
      (click)="cambiarFiltro('pendientes')"
      [class.active]="filtro() === 'pendientes'">
      Pendientes
    </button>

    <button
      (click)="cambiarFiltro('completadas')"
      [class.active]="filtro() === 'completadas'">
      Completadas
    </button>

  </div>

  <!-- Botón para cargar las tareas desde la API -->
  <button
    class="btn-load"
    (click)="taskService.loadTasks()">
    Recargar tareas desde la API
  </button>

  <!-- Lista de tareas -->
  <ul class="task-list">

    @for (tarea of tareasFiltradas(); track tarea.id) {

      <li class="task-item">

        <label class="task-content">

          <input
            type="checkbox"
            [checked]="tarea.completed"
            (change)="taskService.toggleTask(tarea.id)"
          />

          <span [class.completed]="tarea.completed">
            {{ tarea.title }}
          </span>

        </label>
             
        <!-- Botón para eliminar una tarea -->
        <button
          type="button"
          class="btn-delete"
          (click)="taskService.deleteTask(tarea.id)"
          [attr.aria-label]="'Eliminar tarea ' + tarea.title">
          ✕
        </button>


      </li>

    } @empty {

      <li class="empty-message">
        No hay tareas que coincidan con los filtros.
      </li>

    }

  </ul>

  <!-- Cantidad de tareas mostradas -->
  <p class="task-count">
    Mostrando {{ tareasFiltradas().length }} tareas
  </p>

</div>
